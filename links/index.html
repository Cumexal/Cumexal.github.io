            position: relative;

        .shatter-card.ready,
        .fragment-block.ready {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .shatter-card.ready:hover,
        .fragment-block.ready:hover {
            transform: scale(1.02) translateY(-5px) rotate(1deg);
            box-shadow: 10px 10px 0px var(--accent);
            z-index: 10;
        }

        .tilt-card {
            transform-style: preserve-3d;
            will-change: transform;
        }
    </style>

    <script>
        function initTiltEffect() {
            document.querySelectorAll('.tilt-card').forEach(function (card) {
                card.addEventListener('mousemove', handleTiltMouse);
                card.addEventListener('mouseleave', handleTiltReset);
                card.addEventListener('touchmove', handleTiltTouch, { passive: true });
                card.addEventListener('touchend', handleTiltReset);
            });
        }

        function handleTiltMouse(e) {
            var card = this;
            var rect = card.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateY = ((x - centerX) / centerX) * 5;
            var rotateX = ((centerY - y) / centerY) * 5;
            card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.015, 1.015, 1.015)';
        }

        function handleTiltTouch(e) {
            var card = this;
            var touch = e.touches[0];
            var rect = card.getBoundingClientRect();
            var x = touch.clientX - rect.left;
            var y = touch.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateY = ((x - centerX) / centerX) * 4;
            var rotateX = ((centerY - y) / centerY) * 4;
            card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.01, 1.01, 1.01)';
        }

        function handleTiltReset() {
            var card = this;
            card.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
            card.style.transform = '';
            setTimeout(function () {
                card.style.transition = '';
            }, 450);
        }
    </script>

    <main class="w-full h-screen flex flex-col justify-center items-center pt-20 px-4">

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var grid = document.getElementById('links-grid');
            if (window.SiteConfig && SiteConfig.links) {
                SiteConfig.links.forEach(function (link) {
                    var card = document.createElement('a');
                    card.href = link.url;
                    card.target = "_blank";
                    card.className = "group shatter-card tilt-card friend-card p-6 block";

                    var tagsHtml = link.tags
                        ? link.tags.map(function (tag) { return '<span class="text-[10px] bg-[#222] px-2 py-0.5 rounded text-gray-300">#' + tag + '</span>'; }).join('')
                        : '';

                    card.innerHTML = '<div class="flex items-center gap-6 min-w-0">'
                        + '<img src="' + link.avatar + '" alt="' + link.name + '" class="link-avatar w-20 h-20 rounded-full border-2 border-[#333] group-hover:border-[var(--primary)] transition-colors flex-shrink-0">'
                        + '<div class="min-w-0">'
                        + '<h2 class="link-name text-3xl font-bold text-white group-hover:text-[var(--accent)] transition-colors mb-2">' + link.name + '</h2>'
                        + '<p class="link-desc text-sm text-gray-400 group-hover:text-gray-200 transition-colors">' + link.desc + '</p>'
                        + '</div>'
                        + '</div>'
                        + '<div class="flex gap-2 flex-wrap justify-end mt-4 md:mt-0 flex-shrink-0">' + tagsHtml + '</div>';
                    grid.appendChild(card);
                });

                gsap.from('.shatter-card', {
                    opacity: 0,
                    x: -50,
                    stagger: 0.1,
                    duration: 0.8,
                    ease: "back.out(1.5)",
                    onComplete: function () {
                        requestAnimationFrame(function () {
                            document.querySelectorAll('.shatter-card').forEach(function (el) {
                                el.style.transform = '';
                                el.style.opacity = '';
                                el.classList.add('ready');
                            });
                            if (typeof initTiltEffect === 'function') initTiltEffect();
                        });
                    }
                });

                initVerticalScroll();
            }
        });

        function initVerticalScroll() {
            var container = document.getElementById('links-grid');
            var wrapper = document.querySelector('.vertical-scroll-wrapper');
            var currentY = 0;
            var targetY = 0;
            var isAnimating = false;
            var maxScroll = 0;
            var touchStartY = 0;
            var touchStartTargetY = 0;

            function calculateMaxScroll() {
                var totalHeight = container.scrollHeight;
                maxScroll = Math.max(0, totalHeight - wrapper.clientHeight + 64);
            }

            setTimeout(calculateMaxScroll, 100);
            window.addEventListener('resize', calculateMaxScroll);

            wrapper.addEventListener('wheel', function (e) {
                e.preventDefault();
                targetY += e.deltaY * 1.2;
                clampTarget();
                startAnimation();
            }, { passive: false });

            wrapper.addEventListener('touchstart', function (e) {
                touchStartY = e.touches[0].clientY;
                touchStartTargetY = targetY;
            }, { passive: true });

            wrapper.addEventListener('touchmove', function (e) {
                e.preventDefault();
                var deltaY = (e.touches[0].clientY - touchStartY) * 2;
                targetY = touchStartTargetY - deltaY;
                clampTarget();
                currentY = lerp(currentY, targetY, 0.3);
                container.style.transform = 'translate3d(0, ' + (-currentY) + 'px, 0)';
                if (!isAnimating) {
                    isAnimating = true;
                    requestAnimationFrame(updateScroll);
                }
            }, { passive: false });

            function clampTarget() {
                if (targetY < -150) targetY = -150;
                if (targetY > maxScroll + 150) targetY = maxScroll + 150;
            }

            function startAnimation() {
                if (!isAnimating) {
                    isAnimating = true;
                    requestAnimationFrame(updateScroll);
                }
            }

            function updateScroll() {
                if (targetY < 0) {
                    targetY = lerp(targetY, 0, 0.1);
                } else if (targetY > maxScroll) {
                    targetY = lerp(targetY, maxScroll, 0.1);
                }

                currentY = lerp(currentY, targetY, 0.08);
                container.style.transform = 'translate3d(0, ' + (-currentY) + 'px, 0)';

                if (Math.abs(targetY - currentY) < 0.1 && targetY >= 0 && targetY <= maxScroll) {
                    currentY = targetY;
                    isAnimating = false;
                } else {
                    requestAnimationFrame(updateScroll);
                }
            }

            function lerp(start, end, factor) {
                return start + (end - start) * factor;
            }
        }
    </script>

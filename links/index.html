<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/js/site-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Syne:wght@800&display=swap');

        :root {
            --bg: #0a0a0a;
            --primary: #FF3E00;
            --accent: #00E5FF;
            --card-bg: rgba(255,255,255,0.03);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            cursor: crosshair;
        }

        .shatter-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            position: relative;
            border: 1px solid #333;
        }
        
        /* 仅在卡片拥有 ready 类时，启用 hover 过渡，防止与 GSAP 入场动画冲突 */
        .shatter-card.ready,
        .fragment-block.ready {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .shatter-card.ready:hover,
        .fragment-block.ready:hover {
            transform: scale(1.02) translateY(-5px) rotate(1deg);
            border-color: var(--primary);
            box-shadow: 10px 10px 0px var(--accent);
            z-index: 10;
        }
    </style>
<meta name="generator" content="Hexo 8.1.2"></head>

<body class="overflow-hidden"> <!-- 禁用整个页面的滚动 -->
    <nav class="fixed top-0 left-0 w-full p-6 flex justify-between z-50 mix-blend-difference">
    <a href="/" class="text-xl font-bold tracking-tighter text-white" id="brand">CUMEXAL</a>
    <div class="space-x-8 text-sm uppercase tracking-widest text-white" id="nav-links">
        <!-- 导航由 JS 渲染 -->
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navContainer = document.getElementById('nav-links');
        if(navContainer && window.SiteConfig) {
            SiteConfig.nav.links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.className = "hover:text-[var(--accent)] transition-colors";
                a.innerText = link.name;
                navContainer.appendChild(a);
            });
        }
    });
</script>


    <style>
        /* 友链卡片的专属容器与样式 */
        .vertical-scroll-wrapper {
            position: relative;
            width: 100%;
            height: 70vh; /* 限制容器高度 */
            overflow: hidden; /* 隐藏原生滚动条 */
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); /* 上下边缘渐变消失效果，更酷 */
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        .vertical-scroll-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 2rem 1rem;
            will-change: transform;
            cursor: grab;
        }

        .vertical-scroll-container:active {
            cursor: grabbing;
        }

        /* 横躺形卡片 */
        .friend-card {
            width: 100%;
            max-width: 800px;
            margin: 0 auto; /* 居中 */
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .friend-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>

    <main class="w-full h-screen flex flex-col justify-center items-center pt-20 px-4">
        <h1 class="text-6xl font-bold mb-8 uppercase tracking-tighter text-white self-start max-w-7xl mx-auto w-full px-4">Friends_</h1>
        
        <div class="vertical-scroll-wrapper max-w-7xl w-full">
            <div id="links-grid" class="vertical-scroll-container"></div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('links-grid');
            if(window.SiteConfig && SiteConfig.links) {
                // 如果友链太少无法触发滚动，我们复制几份用来演示滚动效果
                let displayLinks = [...SiteConfig.links, ...SiteConfig.links]; 

                displayLinks.forEach(link => {
                    const card = document.createElement('a');
                    card.href = link.url;
                    card.target = "_blank";
                    card.className = "group shatter-card friend-card p-6 block";
                    
                    const tagsHtml = link.tags ? link.tags.map(tag => `<span class="text-[10px] bg-[#222] px-2 py-0.5 rounded text-gray-300">#${tag}</span>`).join('') : '';

                    card.innerHTML = `
                        <div class="flex items-center gap-6">
                            <img src="${link.avatar}" alt="${link.name}" class="w-20 h-20 rounded-full border-2 border-[#333] group-hover:border-[var(--primary)] transition-colors flex-shrink-0">
                            <div>
                                <h2 class="text-3xl font-bold text-white group-hover:text-[var(--accent)] transition-colors mb-2">${link.name}</h2>
                                <p class="text-sm text-gray-400 group-hover:text-gray-200 transition-colors">${link.desc}</p>
                            </div>
                        </div>
                        <div class="flex gap-2 flex-wrap justify-end mt-4 md:mt-0">
                            ${tagsHtml}
                        </div>
                    `;
                    grid.appendChild(card);
                });

                // 进场动画
                gsap.from('.shatter-card', { 
                    opacity: 0, 
                    x: -50, // 从左侧滑入
                    stagger: 0.1, 
                    duration: 0.8, 
                    ease: "back.out(1.5)",
                    clearProps: "all",
                    onComplete: () => {
                        document.querySelectorAll('.shatter-card').forEach(el => el.classList.add('ready'));
                    }
                });

                // 初始化丝滑垂直滚动
                initVerticalScroll();
            }
        });

        function initVerticalScroll() {
            const container = document.getElementById('links-grid');
            const wrapper = document.querySelector('.vertical-scroll-wrapper');
            let currentY = 0;
            let targetY = 0;
            let isAnimating = false;
            
            let maxScroll = 0;
            function calculateMaxScroll() {
                // 容器内所有子元素的总高度 - 包装器的高度
                const totalHeight = container.scrollHeight;
                maxScroll = Math.max(0, totalHeight - wrapper.clientHeight + 64); // 加上 padding 缓冲
            }
            
            // 延迟计算以确保 DOM 渲染完成
            setTimeout(calculateMaxScroll, 100);
            window.addEventListener('resize', calculateMaxScroll);

            // 监听鼠标滚轮 (绑定在 wrapper 上，防止全局干扰)
            wrapper.addEventListener('wheel', (e) => {
                e.preventDefault(); // 阻止默认行为
                
                const scrollAmount = e.deltaY * 1.2; 
                targetY += scrollAmount;
                
                // 边缘抵抗力
                if (targetY < -150) targetY = -150; 
                if (targetY > maxScroll + 150) targetY = maxScroll + 150;
                
                if (!isAnimating) {
                    isAnimating = true;
                    requestAnimationFrame(updateScroll);
                }
            }, { passive: false });

            // 动画循环
            function updateScroll() {
                if (targetY < 0) {
                    targetY = lerp(targetY, 0, 0.1); 
                } else if (targetY > maxScroll) {
                    targetY = lerp(targetY, maxScroll, 0.1); 
                }

                currentY = lerp(currentY, targetY, 0.08);
                container.style.transform = `translate3d(0, ${-currentY}px, 0)`;

                if (Math.abs(targetY - currentY) < 0.1 && targetY >= 0 && targetY <= maxScroll) {
                    currentY = targetY;
                    isAnimating = false;
                } else {
                    requestAnimationFrame(updateScroll);
                }
            }

            function lerp(start, end, factor) {
                return start + (end - start) * factor;
            }
        }
    </script>
</body>
</html>

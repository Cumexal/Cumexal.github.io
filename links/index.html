<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/js/site-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Syne:wght@800&display=swap');

        :root {
            --bg: #0a0a0a;
            --primary: #FF3E00;
            --accent: #00E5FF;
            --card-bg: rgba(255,255,255,0.03);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            cursor: crosshair;
        }

        .shatter-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            position: relative;
            border: 1px solid #333;
        }
        
        /* 仅在卡片拥有 ready 类时，启用 hover 过渡，防止与 GSAP 入场动画冲突 */
        .shatter-card.ready,
        .fragment-block.ready {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .shatter-card.ready:hover,
        .fragment-block.ready:hover {
            transform: scale(1.02) translateY(-5px) rotate(1deg);
            border-color: var(--primary);
            box-shadow: 10px 10px 0px var(--accent);
            z-index: 10;
        }
    </style>
<meta name="generator" content="Hexo 8.1.2"></head>

<body>
    <nav class="fixed top-0 left-0 w-full p-6 flex justify-between z-50 mix-blend-difference">
    <a href="/" class="text-xl font-bold tracking-tighter text-white" id="brand">CUMEXAL</a>
    <div class="space-x-8 text-sm uppercase tracking-widest text-white" id="nav-links">
        <!-- 导航由 JS 渲染 -->
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navContainer = document.getElementById('nav-links');
        if(navContainer && window.SiteConfig) {
            SiteConfig.nav.links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.className = "hover:text-[var(--accent)] transition-colors";
                a.innerText = link.name;
                navContainer.appendChild(a);
            });
        }
    });
</script>


    <main class="p-10 mt-20 min-h-screen max-w-7xl mx-auto">
        <h1 class="text-6xl font-bold mb-12 uppercase tracking-tighter text-white">Friends_</h1>
        
        <div id="links-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('links-grid');
            if(window.SiteConfig && SiteConfig.links) {
                SiteConfig.links.forEach(link => {
                    const card = document.createElement('a');
                    card.href = link.url;
                    card.target = "_blank";
                    // 移除 tailwind 的 border hover 和 transition，让全局 CSS 接管
                    card.className = "group shatter-card p-6 block";
                    
                    const tagsHtml = link.tags ? link.tags.map(tag => `<span class="text-[10px] bg-[#222] px-2 py-0.5 rounded text-gray-300">#${tag}</span>`).join('') : '';

                    card.innerHTML = `
                        <div class="flex items-center gap-4 mb-4">
                            <img src="${link.avatar}" alt="${link.name}" class="w-16 h-16 rounded-full border-2 border-[#333] group-hover:border-[var(--primary)] transition-colors">
                            <div>
                                <h2 class="text-2xl font-bold text-white group-hover:text-[var(--accent)] transition-colors">${link.name}</h2>
                                <div class="flex gap-2 mt-1 flex-wrap">
                                    ${tagsHtml}
                                </div>
                            </div>
                        </div>
                        <p class="text-sm text-gray-400 mt-2 group-hover:text-gray-200 transition-colors">${link.desc}</p>
                    `;
                    grid.appendChild(card);
                });

                // 进场动画：确保所有卡片在动画结束前和结束后样式一致
                gsap.from('.shatter-card', { 
                    opacity: 0, 
                    y: 30, 
                    stagger: 0.2, 
                    duration: 0.6, 
                    ease: "back.out(1.5)",
                    clearProps: "all", // 动画结束后清除行内样式，恢复 CSS 类定义的样式
                    onComplete: () => {
                        document.querySelectorAll('.shatter-card').forEach(el => el.classList.add('ready'));
                    }
                });
            }
        });
    </script>
</body>
</html>

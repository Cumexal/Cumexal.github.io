        .fragment-block.ready {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .shatter-card.ready:hover,
        .fragment-block.ready:hover {
            transform: scale(1.02) translateY(-5px) rotate(1deg);

            box-shadow: 10px 10px 0px var(--accent);

        function initHorizontalScroll() {
            const container = document.getElementById('scroll-container');
            let currentX = 0;
            let targetX = 0;
            let isAnimating = false;
            let maxScroll = 0;

            function calculateMaxScroll() {
                const totalWidth = Array.from(container.children).reduce((acc, child) => acc + child.offsetWidth, 0)
                    + (container.children.length - 1) * 32
                    + window.innerWidth * 0.1;
                maxScroll = Math.max(0, totalWidth - window.innerWidth);
            }

            calculateMaxScroll();
            window.addEventListener('resize', calculateMaxScroll);

            // ----- 鼠标滚轮滚动 -----
            window.addEventListener('wheel', (e) => {
                e.preventDefault();
                targetX += e.deltaY * 1.5;
                clampTarget();
                startAnimation();
            }, { passive: false });

            // ----- 触摸滚动 (移动端) -----
            let touchStartX = 0;
            let touchStartY = 0;
            let isSwiping = false;

            container.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                isSwiping = false;
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const deltaX = touch.clientX - touchStartX;
                const deltaY = Math.abs(touch.clientY - touchStartY);

                // 只有当水平滑动占主导时才拦截，避免与页面垂直滚动冲突
                if (Math.abs(deltaX) > deltaY && Math.abs(deltaX) > 10) {
                    e.preventDefault();
                    targetX -= deltaX * 1.2;
                    clampTarget();
                    startAnimation();
                    isSwiping = true;
                }
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }, { passive: false });

            // ----- 辅助函数 -----
            function clampTarget() {
                if (targetX < -100) targetX = -100;
                if (targetX > maxScroll + 100) targetX = maxScroll + 100;
            }

            function startAnimation() {
                if (!isAnimating) {
                    isAnimating = true;
                    requestAnimationFrame(updateScroll);
                }
            }

            function updateScroll() {
                if (targetX < 0) {
                    targetX = lerp(targetX, 0, 0.1);
                } else if (targetX > maxScroll) {
                    targetX = lerp(targetX, maxScroll, 0.1);
                }

                currentX = lerp(currentX, targetX, 0.08);
                container.style.transform = `translate3d(${-currentX}px, 0, 0)`;

                if (Math.abs(targetX - currentX) < 0.1 && targetX >= 0 && targetX <= maxScroll) {
                    currentX = targetX;
                    isAnimating = false;
                } else {
                    requestAnimationFrame(updateScroll);
                }
            }

            function lerp(start, end, factor) {
                return start + (end - start) * factor;
            }
        }
    </script>

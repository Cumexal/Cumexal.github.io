        :root {
            --bg: #0a0a0a;
            --primary: #FF3E00;
            --accent: #00E5FF;
            --card-bg: rgba(255,255,255,0.03);

        .shatter-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            position: relative;
            border: 1px solid #333;
        }

        .shatter-card.ready,
        .fragment-block.ready {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .shatter-card.ready:hover,
        .fragment-block.ready:hover {
            transform: scale(1.02) translateY(-5px) rotate(1deg);
            border-color: var(--primary);
            box-shadow: 10px 10px 0px var(--accent);
            z-index: 10;
        }

        .tilt-card {
            transform-style: preserve-3d;
            will-change: transform;
        }
    </style>

    <script>
        function initTiltEffect() {
            document.querySelectorAll('.tilt-card').forEach(function (card) {
                card.addEventListener('mousemove', handleTiltMouse);
                card.addEventListener('mouseleave', handleTiltReset);
                card.addEventListener('touchmove', handleTiltTouch, { passive: true });
                card.addEventListener('touchend', handleTiltReset);
            });
        }

        function handleTiltMouse(e) {
            var card = this;
            var rect = card.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateY = ((x - centerX) / centerX) * 5;
            var rotateX = ((centerY - y) / centerY) * 5;
            card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.015, 1.015, 1.015)';
        }

        function handleTiltTouch(e) {
            var card = this;
            var touch = e.touches[0];
            var rect = card.getBoundingClientRect();
            var x = touch.clientX - rect.left;
            var y = touch.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateY = ((x - centerX) / centerX) * 4;
            var rotateX = ((centerY - y) / centerY) * 4;
            card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.01, 1.01, 1.01)';
        }

        function handleTiltReset() {
            var card = this;
            card.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
            card.style.transform = '';
            setTimeout(function () {
                card.style.transition = '';
            }, 450);
        }
    </script>

    <script>
        // =============================================
        //  从 SiteConfig 读取数据渲染首页
        //  如果某些字段缺失，使用硬编码兜底
        // =============================================
        var cfg = window.SiteConfig || {};

        if (cfg.hero) {
            document.getElementById('main-title').innerHTML = cfg.hero.title || 'CODE<br><span class="text-transparent" style="-webkit-text-stroke: 2px var(--primary);">LOGIC</span>';
            document.getElementById('bio-text').innerText = cfg.hero.subtitle || '打破常规，重构逻辑';
            document.getElementById('bg-title').innerText = cfg.hero.bgTitle || 'FRAGMENT';
        }

        if (cfg.avatar) {
            var avatarImg = document.getElementById('avatar-img');
            if (avatarImg && cfg.avatar.image) {
                avatarImg.src = cfg.avatar.image;
            }
        }

        var stackConfig = cfg.techStack || {};
        if (stackConfig.title) {
            document.getElementById('stack-title').innerText = stackConfig.title;
        }
        var stackItems = stackConfig.items || ["嵌入式", "硬件", "物联网", "计算机"];
        var stackList = document.getElementById('tech-stack');
        stackItems.forEach(function (item) {
            var li = document.createElement('li');
            li.innerText = '> ' + item;
            stackList.appendChild(li);
        });

        var logConfig = cfg.latestLog || {};
        if (logConfig.title) {
            document.getElementById('log-title').innerHTML = logConfig.title;
        }
        document.getElementById('latest-post').innerText = logConfig.content || '智能球门';
        if (logConfig.link) {
            document.getElementById('frag-log').onclick = function () { window.location.href = logConfig.link; };
        }

        window.addEventListener('load', function () {
            var tl = gsap.timeline();

            tl.from('#bg-title', {
                duration: 2,
                opacity: 0,
                scale: 0.5,
                ease: "expo.out"
            }, 0)

            .from('#hero-title-block', {
                duration: 1.5,
                scale: 0,
                rotation: -15,
                x: 200,
                opacity: 0,
                ease: "back.out(1.5)"
            }, 0.1)

            .from('.fragment-block', {
                duration: 1.5,
                scale: 0,
                rotation: function () { return Math.random() * 180 - 90; },
                x: function () { return Math.random() * 800 - 400; },
                y: function () { return Math.random() * 800 - 400; },
                opacity: 0,
                stagger: 0.1,
                ease: "expo.out",
                onComplete: function () {
                    requestAnimationFrame(function () {
                        document.querySelectorAll('.fragment-block').forEach(function (el) {
                            el.style.transform = '';
                            el.style.opacity = '';
                            el.classList.add('ready');
                        });
                        if (typeof initTiltEffect === 'function') initTiltEffect();
                    });
                }
            }, 0.15);
        });
    </script>

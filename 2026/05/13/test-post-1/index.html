<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/js/site-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Syne:wght@800&display=swap');

        :root {
            --bg: #0a0a0a;
            --primary: #FF3E00;
            --accent: #00E5FF;
            --card-bg: rgba(255,255,255,0.03);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            cursor: crosshair;
        }

        .shatter-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            position: relative;
            border: 1px solid #333;
        }
        
        /* 仅在卡片拥有 ready 类时，启用 hover 过渡，防止与 GSAP 入场动画冲突 */
        .shatter-card.ready,
        .fragment-block.ready {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .shatter-card.ready:hover,
        .fragment-block.ready:hover {
            transform: scale(1.02) translateY(-5px) rotate(1deg);
            border-color: var(--primary);
            box-shadow: 10px 10px 0px var(--accent);
            z-index: 10;
        }
    </style>
<meta name="generator" content="Hexo 8.1.2"></head>

<body>
    <nav class="fixed top-0 left-0 w-full p-6 flex justify-between z-50 mix-blend-difference">
    <a href="/" class="text-xl font-bold tracking-tighter text-white" id="brand">CUMEXAL</a>
    <div class="space-x-8 text-sm uppercase tracking-widest text-white" id="nav-links">
        <!-- 导航由 JS 渲染 -->
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navContainer = document.getElementById('nav-links');
        if(navContainer && window.SiteConfig) {
            SiteConfig.nav.links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.className = "hover:text-[var(--accent)] transition-colors";
                a.innerText = link.name;
                navContainer.appendChild(a);
            });
        }
    });
</script>


    <main class="relative w-full h-screen overflow-hidden bg-[var(--bg)] flex items-center justify-center pt-16">
        <h1 class="hero-text absolute z-0 text-[18vw] md:text-[22vw] text-white opacity-5 whitespace-nowrap top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none select-none" id="bg-title">
            FRAGMENT
        </h1>

        <div class="relative w-full max-w-7xl h-[80vh] mx-auto p-4 fragment-container">

            <div class="absolute top-[10%] left-[5%] z-40" id="hero-title-block">
                <h1 class="hero-text text-[10vw] md:text-[8vw] text-white leading-none mix-blend-difference" id="main-title">
                    CODE<br><span class="text-transparent" style="-webkit-text-stroke: 2px var(--primary);">LOGIC</span>
                </h1>
                <p class="mt-4 text-xl md:text-2xl text-[var(--accent)] font-mono tracking-widest uppercase" id="bio-text">Loading...</p>
            </div>

            <div class="fragment-block absolute bottom-[15%] left-[10%] w-[60%] md:w-[25%] bg-[var(--card-bg)] backdrop-blur-md border border-[#333] p-6 z-30 hover:border-[var(--primary)] transition-colors" id="frag-stack">
                <h3 class="text-xs uppercase mb-4 text-[var(--primary)] tracking-widest font-bold" id="stack-title">// TECH_STACK</h3>
                <ul class="text-sm font-mono space-y-2 text-gray-300" id="tech-stack"></ul>
            </div>

            <div class="fragment-block absolute bottom-[10%] right-[15%] w-[70%] md:w-[30%] bg-white text-black p-8 z-30 hover:bg-[var(--accent)] hover:text-black transition-colors cursor-pointer" id="frag-log" onclick="window.location.href='/archives/'">
                <h3 class="font-bold text-3xl md:text-4xl leading-none uppercase mb-6" id="log-title">Latest<br>Log_</h3>
                <div id="latest-post" class="text-sm font-mono border-t border-black pt-4">"Parsing the future of silicon..."</div>
            </div>

        </div>

        <style>
            .hero-text {
                font-family: 'Syne', sans-serif;
                letter-spacing: -0.05em;
            }

            @media (max-width: 768px) {
                .fragment-container { height: 100vh; padding-top: 20%; }

                #hero-title-block {
                    position: relative;
                    top: 0; left: 0;
                    margin-bottom: 2rem;
                    text-align: center;
                }

                #frag-stack {
                    position: relative;
                    bottom: auto; left: 0;
                    width: 100%;
                    margin-bottom: 1rem;
                }

                #frag-log {
                    position: relative;
                    bottom: auto; right: 0;
                    width: 100%;
                }
            }
        </style>
    </main>

    <script>
        // =============================================
        //  从 SiteConfig 读取数据渲染首页
        //  如果某些字段缺失，使用硬编码兜底
        // =============================================
        const cfg = window.SiteConfig || {};

        // 标题
        if (cfg.hero) {
            document.getElementById('main-title').innerHTML = cfg.hero.title || 'CODE<br><span class="text-transparent" style="-webkit-text-stroke: 2px var(--primary);">LOGIC</span>';
            document.getElementById('bio-text').innerText = cfg.hero.subtitle || '打破常规，重构逻辑';
            document.getElementById('bg-title').innerText = cfg.hero.bgTitle || 'FRAGMENT';
        }

        // 技术栈
        const stackConfig = cfg.techStack || {};
        if (stackConfig.title) {
            document.getElementById('stack-title').innerText = stackConfig.title;
        }
        const stackItems = stackConfig.items || ["嵌入式", "硬件", "物联网", "计算机"];
        const stackList = document.getElementById('tech-stack');
        stackItems.forEach(item => {
            let li = document.createElement('li');
            li.innerText = `> ${item}`;
            stackList.appendChild(li);
        });

        // 最新日志
        const logConfig = cfg.latestLog || {};
        if (logConfig.title) {
            document.getElementById('log-title').innerHTML = logConfig.title;
        }
        document.getElementById('latest-post').innerText = logConfig.content || '智能球门';
        if (logConfig.link) {
            document.getElementById('frag-log').onclick = function() { window.location.href = logConfig.link; };
        }

        // 进场动画
        window.addEventListener('load', () => {
            const tl = gsap.timeline();

            tl.from('#bg-title', {
                duration: 2,
                opacity: 0,
                scale: 0.5,
                ease: "expo.out"
            }, 0)

            .from('#hero-title-block', {
                duration: 1.5,
                scale: 0,
                rotation: -15,
                x: 200,
                opacity: 0,
                ease: "back.out(1.5)"
            }, 0.1)

            .from('.fragment-block', {
                duration: 1.5,
                scale: 0,
                rotation: () => Math.random() * 180 - 90,
                x: () => Math.random() * 800 - 400,
                y: () => Math.random() * 800 - 400,
                opacity: 0,
                stagger: 0.1,
                ease: "expo.out",
                clearProps: "all",
                onComplete: () => {
                    document.querySelectorAll('.fragment-block').forEach(el => el.classList.add('ready'));
                }
            }, 0.15);
        });
    </script>
</body>
</html>

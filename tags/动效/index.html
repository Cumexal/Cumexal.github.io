<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/js/site-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Syne:wght@800&display=swap');

        :root {
            --bg: #0a0a0a;
            --primary: #FF3E00;
            --accent: #00E5FF;
            --card-bg: rgba(255,255,255,0.03);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            cursor: crosshair;
        }

        .shatter-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            position: relative;
            border: 1px solid #333;
        }
        
        /* 仅在卡片拥有 ready 类时，启用 hover 过渡，防止与 GSAP 入场动画冲突 */
        .shatter-card.ready,
        .fragment-block.ready {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .shatter-card.ready:hover,
        .fragment-block.ready:hover {
            transform: scale(1.02) translateY(-5px) rotate(1deg);
            border-color: var(--primary);
            box-shadow: 10px 10px 0px var(--accent);
            z-index: 10;
        }
    </style>
<meta name="generator" content="Hexo 8.1.2"></head>

<body class="overflow-hidden"> <!-- 隐藏全局垂直滚动条 -->
    <nav class="fixed top-0 left-0 w-full p-6 flex justify-between z-50 mix-blend-difference">
    <a href="/" class="text-xl font-bold tracking-tighter text-white" id="brand">CUMEXAL</a>
    <div class="space-x-8 text-sm uppercase tracking-widest text-white" id="nav-links">
        <!-- 导航由 JS 渲染 -->
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navContainer = document.getElementById('nav-links');
        if(navContainer && window.SiteConfig) {
            SiteConfig.nav.links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.className = "hover:text-[var(--accent)] transition-colors";
                a.innerText = link.name;
                navContainer.appendChild(a);
            });
        }
    });
</script>

    
    <!-- 引入横向滚动所需的样式 -->
    <style>
        .horizontal-scroll-container {
            display: flex;
            gap: 2rem;
            padding: 0 5vw; /* 两侧留白 */
            height: 70vh; /* 固定高度 */
            align-items: center;
            flex-wrap: nowrap;
            will-change: transform; /* 优化动画性能 */
            cursor: grab;
        }
        .horizontal-scroll-container:active {
            cursor: grabbing;
        }
        
        .doc-card {
            flex: 0 0 350px; /* 固定宽度，不收缩 */
            height: 500px; /* 竖立形的高长比例 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        /* 移动端适配，卡片变窄 */
        @media (max-width: 768px) {
            .doc-card { flex: 0 0 280px; height: 400px; }
        }
    </style>

    <main class="w-full h-screen flex flex-col justify-center pt-20">
        <h1 class="text-6xl font-bold mb-8 uppercase tracking-tighter text-white px-10">Archives_</h1>
        
        <!-- 外层包裹器，用于隐藏原生的横向滚动条 -->
        <div class="w-full overflow-hidden select-none">
            <!-- 实际滚动的容器 -->
            <div class="horizontal-scroll-container" id="scroll-container">
                
                    <article class="doc-card shatter-card p-8 cursor-pointer border border-[#333]" onclick="window.location.href='/2026/05/14/test-post-2/'">
                        <div>
                            <time class="text-[var(--accent)] text-sm font-mono block mb-4">2026-05-14</time>
                            <h2 class="text-3xl font-bold text-white mb-4 line-clamp-3">测试文章 2：边缘回弹效果</h2>
                            <p class="text-gray-400 text-sm line-clamp-4 mt-4">
                                
                                    当你滑到这篇（或最后一篇）文章时，继续滑动鼠标滚轮，会看到卡片被拉拽，然后松开滚轮时会弹回原位。
...
                                
                            </p>
                        </div>
                        <div class="mt-6 flex gap-2 flex-wrap">
                            
                                
                                    <span class="text-xs bg-[#222] px-2 py-1 rounded text-gray-300">#动效</span>
                                
                            
                        </div>
                    </article>
                
            </div>
        </div>
    </main>

    <script>
        // 文档页面的碎片进场动画
        window.addEventListener('load', () => {
            gsap.from('h1', { duration: 1, x: -50, opacity: 0, ease: "power3.out" });
            gsap.from('.doc-card', { 
                duration: 1, 
                x: 100, // 从右侧滑入
                opacity: 0, 
                stagger: 0.1, 
                ease: "power4.out",
                clearProps: "all",
                onComplete: () => {
                    document.querySelectorAll('.doc-card').forEach(el => el.classList.add('ready'));
                }
            });
            
            // 丝滑横向滚动逻辑
            initHorizontalScroll();
        });

        function initHorizontalScroll() {
            const container = document.getElementById('scroll-container');
            let currentX = 0;
            let targetX = 0;
            let isAnimating = false;
            
            // 计算最大可滚动距离 (容器总宽度 - 视口宽度)
            // 需要在窗口 resize 时重新计算
            let maxScroll = 0;
            function calculateMaxScroll() {
                // 容器内所有子元素的总宽度 + gap + padding
                const totalWidth = Array.from(container.children).reduce((acc, child) => acc + child.offsetWidth, 0) 
                                 + (container.children.length - 1) * 32 // 2rem gap = 32px
                                 + window.innerWidth * 0.1; // 5vw padding on each side
                maxScroll = Math.max(0, totalWidth - window.innerWidth);
            }
            
            calculateMaxScroll();
            window.addEventListener('resize', calculateMaxScroll);

            // 监听鼠标滚轮
            window.addEventListener('wheel', (e) => {
                // 阻止默认垂直滚动
                e.preventDefault(); 
                
                // 将垂直滚动(deltaY)映射到水平滚动
                const scrollAmount = e.deltaY * 1.5; 
                targetX += scrollAmount;
                
                // 增加边缘抵抗力：允许越界一点点，但在动画循环中会被拉回来
                if (targetX < -100) targetX = -100; // 左边缘抵抗
                if (targetX > maxScroll + 100) targetX = maxScroll + 100; // 右边缘抵抗
                
                if (!isAnimating) {
                    isAnimating = true;
                    requestAnimationFrame(updateScroll);
                }
            }, { passive: false });

            // 动画循环：使用 lerp (线性插值) 实现丝滑跟随和边缘回弹
            function updateScroll() {
                // 边缘回弹逻辑
                if (targetX < 0) {
                    targetX = lerp(targetX, 0, 0.1); // 如果越界，目标值缓慢向 0 靠拢
                } else if (targetX > maxScroll) {
                    targetX = lerp(targetX, maxScroll, 0.1); // 如果越界，目标值缓慢向 maxScroll 靠拢
                }

                // 当前位置向目标位置丝滑逼近
                currentX = lerp(currentX, targetX, 0.08);

                // 应用变换
                container.style.transform = `translate3d(${-currentX}px, 0, 0)`;

                // 停止条件：距离极小且没有越界
                if (Math.abs(targetX - currentX) < 0.1 && targetX >= 0 && targetX <= maxScroll) {
                    currentX = targetX;
                    isAnimating = false;
                } else {
                    requestAnimationFrame(updateScroll);
                }
            }

            // 工具函数：线性插值
            function lerp(start, end, factor) {
                return start + (end - start) * factor;
            }
        }
    </script>
</body>
</html>

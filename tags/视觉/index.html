        :root {
            --bg: #0a0a0a;

        .shatter-card {

        .shatter-card.ready,
        .fragment-block.ready {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .shatter-card.ready:hover,
        .fragment-block.ready:hover {
            transform: scale(1.02) translateY(-5px) rotate(1deg);
            box-shadow: 10px 10px 0px var(--accent);
            z-index: 10;
        }

        .tilt-card {
            transform-style: preserve-3d;
            will-change: transform;
        }

            letter-spacing: -0.05em;

        /* FOUC: 在 GSAP 接管之前隐藏动画元素 */

            opacity: 0;

    <script>
        function initTiltEffect() {
            document.querySelectorAll('.tilt-card').forEach(function (card) {
                card.addEventListener('mousemove', handleTiltMouse);
                card.addEventListener('mouseleave', handleTiltReset);
                card.addEventListener('touchmove', handleTiltTouch, { passive: true });
                card.addEventListener('touchend', handleTiltReset);
            });
        }

        function handleTiltMouse(e) {
            var card = this;
            var rect = card.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateY = ((x - centerX) / centerX) * 5;
            var rotateX = ((centerY - y) / centerY) * 5;
            card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.015, 1.015, 1.015)';
        }

        function handleTiltTouch(e) {
            var card = this;
            var touch = e.touches[0];
            var rect = card.getBoundingClientRect();
            var x = touch.clientX - rect.left;
            var y = touch.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateY = ((x - centerX) / centerX) * 4;
            var rotateX = ((centerY - y) / centerY) * 4;
            card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.01, 1.01, 1.01)';
        }

        function handleTiltReset() {
            var card = this;
            card.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
            card.style.transform = '';
            setTimeout(function () {
                card.style.transition = '';
            }, 450);
        }
    </script>

    <main class="w-full h-screen flex flex-col justify-center pt-20" id="page-main">
        <h1 class="hero-text absolute z-0 text-[18vw] md:text-[22vw] text-white opacity-[0.04] whitespace-nowrap top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none select-none" id="archive-bg-title"></h1>
        <h1 class="text-6xl font-bold mb-8 uppercase tracking-tighter text-white px-10">Archives_</h1>

        <div class="w-full overflow-hidden select-none">
            <div class="horizontal-scroll-container" id="scroll-container">
            </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 背景衬底大字
            var bgTitleEl = document.getElementById('archive-bg-title');
            if (bgTitleEl && window.SiteConfig && window.SiteConfig.documentsBgTitle) {
                bgTitleEl.innerText = window.SiteConfig.documentsBgTitle;
            }

            var container = document.getElementById('scroll-container');

            var docs = window.SiteConfig && Array.isArray(window.SiteConfig.documents)
                ? window.SiteConfig.documents
                : [];

            docs.forEach(function (doc) {
                var article = document.createElement('article');
                article.className = 'doc-card shatter-card tilt-card p-8 cursor-pointer fouc-hidden';
                article.onclick = function () { window.location.href = doc.link; };

                var tagsHtml = doc.tags && doc.tags.length
                    ? doc.tags.map(function (t) { return '<span class="text-xs bg-[#222] px-2 py-1 rounded text-gray-300">#' + t + '</span>'; }).join('')
                    : '';

                article.innerHTML = '<div>'
                    + '<time class="text-[var(--accent)] text-sm font-mono block mb-4">' + (doc.date || '') + '</time>'
                    + '<h2 class="text-3xl font-bold text-white mb-4 line-clamp-3">' + doc.title + '</h2>'
                    + '<p class="text-gray-400 text-sm line-clamp-4 mt-4">' + doc.description + '</p>'
                    + '</div>'
                    + '<div class="mt-6 flex gap-2 flex-wrap">' + tagsHtml + '</div>';
                container.appendChild(article);
            });

            gsap.fromTo('.doc-card',
                { opacity: 0, x: 100 },
                { duration: 1, opacity: 1, x: 0, stagger: 0.1, ease: "power4.out",
                onComplete: function () {
                    requestAnimationFrame(function () {
                        document.querySelectorAll('.doc-card').forEach(function (el) {
                            el.classList.remove('fouc-hidden');
                            el.style.transform = '';
                            el.style.opacity = '';
                            el.classList.add('ready');
                        });
                        if (typeof initTiltEffect === 'function') initTiltEffect();
                    });
                }
            });

            initHorizontalScroll();
        });

        function initHorizontalScroll() {
            var container = document.getElementById('scroll-container');
            var currentX = 0;
            var targetX = 0;
            var isAnimating = false;
            var maxScroll = 0;
            var touchStartX = 0;
            var touchStartScrollX = 0;
            var velocityX = 0;
            var lastTouchX = 0;

            function calculateMaxScroll() {
                var totalWidth = Array.from(container.children).reduce(function (acc, child) { return acc + child.offsetWidth; }, 0)
                    + (container.children.length - 1) * 32
                    + window.innerWidth * 0.1;
                maxScroll = Math.max(0, totalWidth - window.innerWidth);
            }

            calculateMaxScroll();
            window.addEventListener('resize', calculateMaxScroll);

            window.addEventListener('wheel', function (e) {
                e.preventDefault();
                targetX += e.deltaY * 1.5;
                clampTarget();
                startAnimation();
            }, { passive: false });

            container.addEventListener('touchstart', function (e) {
                isAnimating = false;
                touchStartX = e.touches[0].clientX;
                touchStartScrollX = currentX;
                lastTouchX = touchStartX;
                velocityX = 0;
            }, { passive: true });

            container.addEventListener('touchmove', function (e) {
                e.preventDefault();
                var dx = e.touches[0].clientX - touchStartX;
                targetX = touchStartScrollX - dx;
                clampTarget();
                currentX = targetX;
                container.style.transform = 'translate3d(' + (-currentX) + 'px, 0, 0)';
                velocityX = e.touches[0].clientX - lastTouchX;
                lastTouchX = e.touches[0].clientX;
            }, { passive: false });

            container.addEventListener('touchend', function () {
                if (Math.abs(velocityX) > 1) {
                    targetX -= velocityX * 10;
                    clampTarget();
                }
                startAnimation();
            }, { passive: true });

            function clampTarget() {
                if (targetX < -100) targetX = -100;
                if (targetX > maxScroll + 100) targetX = maxScroll + 100;
            }

            function startAnimation() {
                if (!isAnimating) {
                    isAnimating = true;
                    requestAnimationFrame(updateScroll);
                }
            }

            function updateScroll() {
                if (targetX < 0) {
                    targetX = lerp(targetX, 0, 0.08);
                } else if (targetX > maxScroll) {
                    targetX = lerp(targetX, maxScroll, 0.08);
                }

                currentX = lerp(currentX, targetX, 0.05);
                container.style.transform = 'translate3d(' + (-currentX) + 'px, 0, 0)';

                if (Math.abs(targetX - currentX) < 0.1 && targetX >= 0 && targetX <= maxScroll) {
                    currentX = targetX;
                    isAnimating = false;
                } else {
                    requestAnimationFrame(updateScroll);
                }
            }

            function lerp(start, end, factor) {
                return start + (end - start) * factor;
            }
        }
    </script>

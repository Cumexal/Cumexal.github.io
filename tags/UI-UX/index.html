    <script>
        function initTiltEffect() {
            document.querySelectorAll('.tilt-card').forEach(function (card) {
                card.addEventListener('mousemove', handleTiltMouse);
                card.addEventListener('mouseleave', handleTiltReset);
                card.addEventListener('touchmove', handleTiltTouch, { passive: true });
                card.addEventListener('touchend', handleTiltReset);
            });
        }

        function handleTiltMouse(e) {
            var card = this;
            var rect = card.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateY = ((x - centerX) / centerX) * 5;
            var rotateX = ((centerY - y) / centerY) * 5;
            card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.015, 1.015, 1.015)';
        }

        function handleTiltTouch(e) {
            var card = this;
            var touch = e.touches[0];
            var rect = card.getBoundingClientRect();
            var x = touch.clientX - rect.left;
            var y = touch.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateY = ((x - centerX) / centerX) * 4;
            var rotateX = ((centerY - y) / centerY) * 4;
            card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.01, 1.01, 1.01)';
        }

        function handleTiltReset() {
            var card = this;
            card.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
            card.style.transform = '';
            setTimeout(function () {
                card.style.transition = '';
            }, 450);
        }
    </script>

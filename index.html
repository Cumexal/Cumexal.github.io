<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumexal | Personal Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Syne:wght@800&display=swap');

        :root {
            --bg: #0a0a0a;
            --accent: #00ff66; /* Neon Green - change this for a new vibe */
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Space+Grotesk', sans-serif;
            overflow-x: hidden;
        }

        .hero-text {
            font-family: 'Syne', sans-serif;
            line-height: 0.8;
            letter-spacing: -5px;
            text-transform: uppercase;
        }

        /* The "Anti-Stack" Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(8, 10vh);
            gap: 1rem;
            padding: 1rem;
        }

        .card {
            border: 1px solid #333;
            padding: 1.5rem;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.02);
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }

        .marquee {
            white-space: nowrap;
            overflow: hidden;
            border-top: 1px solid var(--accent);
            border-bottom: 1px solid var(--accent);
        }
    </style>
</head>
<body>

    <!-- Corner Nav (Minimalist) -->
    <nav class="fixed top-0 left-0 w-full p-6 flex justify-between z-50 mix-blend-difference">
        <div class="text-xl font-bold tracking-tighter" id="brand">CUMEXAL</div>
        <div class="space-x-8 text-sm uppercase tracking-widest">
            <a href="#" class="hover:text-[var(--accent)]">Work</a>
            <a href="#" class="hover:text-[var(--accent)]">Bits</a>
            <a href="#" class="hover:text-[var(--accent)]">About</a>
        </div>
    </nav>

    <main class="bento-grid mt-12">
        <!-- Big Statement Header -->
        <div class="col-span-12 md:col-span-8 row-span-3 flex flex-col justify-end">
            <h1 class="hero-text text-[12vw] md:text-[15vw] text-white opacity-90" id="main-title">
                CODE<br><span class="text-transparent" style="-webkit-text-stroke: 2px white;">LOGIC</span>
            </h1>
        </div>

        <!-- Bio Card -->
        <div class="card col-span-12 md:col-span-4 row-span-2 flex flex-col justify-between">

            <p class="text-lg leading-tight" id="bio-text">Loading...</p>
        </div>

        <!-- Quick Links / GitHub Stats -->
        <div class="card col-span-6 md:col-span-2 row-span-2 border-l-4 border-l-[var(--accent)]">
            <h3 class="text-xs uppercase mb-4 text-[var(--accent)]">Stack</h3>
            <ul class="text-sm space-y-1" id="tech-stack"></ul>
        </div>

        <!-- Dynamic Content Box -->
        <div class="card col-span-6 md:col-span-3 row-span-4 bg-white text-black flex flex-col justify-between">
            <h3 class="font-bold text-4xl leading-none">最新<br>  日志_</h3>
            <div id="latest-post" class="text-sm italic">"Parsing the future of silicon..."</div>
        </div>

        <!-- Image/Art Box (Replace src with your photo) -->
        <div class="col-span-12 md:col-span-7 row-span-3 relative overflow-hidden grayscale hover:grayscale-0 transition-all duration-700">
            <img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070" class="object-cover w-full h-full">
            <div class="absolute bottom-4 left-4 bg-black p-2 text-[10px]" id="img-caption">LOCATION: SOUTHEAST UNIVERSITY / 2026</div>
        </div>
    </main>

    <!-- Scrolling Sticker Text (Easy to modify below) -->
    <div class="marquee py-2 mt-4">
        <div class="animate-marquee inline-block text-sm uppercase" id="ticker">
            <!-- Will be populated by JS -->
        </div>
    </div>

    <script>
        // --- EDIT YOUR INFORMATION HERE ---
        const USER_DATA = {
            brand: "CUMEXAL",
            mainTitle: "CRAFTING<br>SYSTEMS",
            bio: "CUMEXAL.",
            stack: ["嵌入式", "硬件", "物联网", "计算机"],
            latestPost: "智能球门",
            imageCaption: "OMS-海猴科技",
            tickerText: " • ESP-IDF • Arduino • STM32 • STC • PYTHON • C • HTML • ioT"
        };

        // --- ASSIGNMENT LOGIC ---
        document.getElementById('brand').innerText = USER_DATA.brand;
        document.getElementById('main-title').innerHTML = USER_DATA.mainTitle;
        document.getElementById('bio-text').innerText = USER_DATA.bio;
        document.getElementById('latest-post').innerText = USER_DATA.latestPost;
        document.getElementById('img-caption').innerText = USER_DATA.imageCaption;
        
        const stackList = document.getElementById('tech-stack');
        USER_DATA.stack.forEach(item => {
            let li = document.createElement('li');
            li.innerText = `> ${item}`;
            stackList.appendChild(li);
        });

        const ticker = document.getElementById('ticker');
        ticker.innerText = (USER_DATA.tickerText + " ").repeat(10);
    </script>

    <style>
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-block;
            animation: marquee 20s linear infinite;
        }
    </style>
</body>
</html>

    <script>
        function initTiltEffect() {
            document.querySelectorAll('.tilt-card').forEach(function (card) {
                card.addEventListener('mousemove', handleTiltMouse);
                card.addEventListener('mouseleave', handleTiltReset);
                card.addEventListener('touchmove', handleTiltTouch, { passive: true });
                card.addEventListener('touchend', handleTiltReset);
            });
        }

        function handleTiltMouse(e) {
            var card = this;
            var rect = card.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateY = ((x - centerX) / centerX) * 5;
            var rotateX = ((centerY - y) / centerY) * 5;
            card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.015, 1.015, 1.015)';
        }

        function handleTiltTouch(e) {
            var card = this;
            var touch = e.touches[0];
            var rect = card.getBoundingClientRect();
            var x = touch.clientX - rect.left;
            var y = touch.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateY = ((x - centerX) / centerX) * 4;
            var rotateX = ((centerY - y) / centerY) * 4;
            card.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.01, 1.01, 1.01)';
        }

        function handleTiltReset() {
            var card = this;
            card.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
            card.style.transform = '';
            setTimeout(function () {
                card.style.transition = '';
            }, 450);
        }
    </script>

                { opacity: 0, scale: 0,
                    rotation: function () { return Math.random() * 180 - 90; },
                    x: function () { return Math.random() * 800 - 400; },
                    y: function () { return Math.random() * 800 - 400; }
                },
                { duration: 1.5, opacity: 1, scale: 1, rotation: 0, x: 0, y: 0,
                    stagger: 0.1, ease: "expo.out",
                    onComplete: function () {
                        requestAnimationFrame(function () {
                            document.querySelectorAll('.fouc-hidden').forEach(function (el) {
                                el.classList.remove('fouc-hidden');
                                el.style.transform = '';
                                el.style.opacity = '';
                            });
                            document.querySelectorAll('.fragment-block').forEach(function (el) {
                                el.classList.add('ready');
                            });
                            if (typeof initTiltEffect === 'function') initTiltEffect();
                            // 主页动画完成后再显示通知弹窗
                            setTimeout(showPopup, 500);
                        });
                    }
                },
            0.15);
        });

        /* ========== 通知弹窗逻辑 ========== */
        var popupCfg = cfg.popup || {};

        // 填充消息内容
        function renderPopupMessage() {
            var msgEl = document.getElementById('popup-message');
            if (!msgEl) return;
            var lines = popupCfg.message || [];
            lines.forEach(function (line) {
                var p = document.createElement('p');
                if (line === '') {
                    p.className = 'empty';
                }
                p.innerText = line;
                msgEl.appendChild(p);
            });
            // 标题
            var titleEl = document.getElementById('popup-title');
            if (titleEl && popupCfg.title) {
                titleEl.innerHTML = popupCfg.title;
            }
            // 签名
            var sigEl = document.getElementById('popup-signature');
            if (sigEl && popupCfg.signature) {
                sigEl.innerText = popupCfg.signature;
            }
        }

        function showPopup() {
            if (!popupCfg.enabled) return;
            var overlay = document.getElementById('popup-overlay');
            var card = document.getElementById('popup-card');
            if (!overlay || !card) return;

            renderPopupMessage();

            // 先显示 overlay
            overlay.classList.add('active');

            // GSAP 动画：卡片弹入
            gsap.fromTo(card,
                { scale: 0.7, y: 60, opacity: 0 },
                { duration: 0.8, scale: 1, y: 0, opacity: 1, ease: "back.out(1.7)" }
            );

            // overlay 淡入
            gsap.fromTo(overlay,
                { opacity: 0 },
                { duration: 0.4, opacity: 1, ease: "power2.out", overwrite: true }
            );
        }

        function closePopup() {
            var overlay = document.getElementById('popup-overlay');
            var card = document.getElementById('popup-card');
            if (!overlay || !card) return;

            gsap.to(card, {
                duration: 0.4,
                scale: 0.8,
                y: 40,
                opacity: 0,
                ease: "power2.in"
            });

            gsap.to(overlay, {
                duration: 0.3,
                opacity: 0,
                ease: "power2.in",
                onComplete: function () {
                    overlay.classList.remove('active');
                }
            });
        }

        // 绑定关闭事件
        document.addEventListener('DOMContentLoaded', function () {
            var closeBtn = document.getElementById('popup-close');
            var overlay = document.getElementById('popup-overlay');
            if (closeBtn) closeBtn.addEventListener('click', closePopup);
            if (overlay) overlay.addEventListener('click', function (e) {
                if (e.target === overlay) closePopup();
            });
        });
        </script>
</body>
</html>
